name: Build the image
on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        caddy_version:
          # Must be a version supported by coraza-caddy v2.5.0 (its go.mod pins Caddy 2.11.2).
          # Bump alongside the CORAZA_VERSION build-arg default in the Dockerfile.
          - 2.11.2
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/caddy-coraza:${{ matrix.caddy_version }}
            ghcr.io/${{ github.repository_owner }}/caddy-coraza:latest
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/caddy-coraza:${{ matrix.caddy_version }}
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/caddy-coraza:latest
          build-args: |
            CADDY_VERSION=${{ matrix.caddy_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
